name: Build WWF WrestleFest Saturn Test255

on:
  workflow_dispatch:
  push:
    branches:
      - test255-attract-wip
    paths:
      - .github/workflows/build-wrestlefest-saturn-test255.yml
      - campaign_presentation.c
      - campaign_presentation.h
      - wip/test255/**
      - build-input/WWF-Saturn-Test255-WIP9-source.zip

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YAUL_IMAGE: ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6
    steps:
      - name: Check out Test255 WIP branch
        uses: actions/checkout@v5
        with:
          ref: test255-attract-wip

      - name: Locate Test255 source payload
        shell: bash
        run: |
          set -euo pipefail
          test -f build-input/WWF-Saturn-Test255-WIP9-source.zip || {
            echo 'Missing build-input/WWF-Saturn-Test255-WIP9-source.zip'
            exit 2
          }

      - name: Restore Test255 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wwf-test255 build-test255
          mkdir -p /tmp/wwf-test255 build-test255
          unzip -q build-input/WWF-Saturn-Test255-WIP9-source.zip -d /tmp/wwf-test255
          cp -a /tmp/wwf-test255/. ./build-test255/
          cp campaign_presentation.c campaign_presentation.h build-test255/

      - name: Verify source payload completeness
        shell: bash
        run: |
          set -euo pipefail
          cd build-test255
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('Makefile').read_text()
          m=re.search(r'^SH_SRCS\s*:?=\s*(.+)$', text, re.M)
          if not m:
              raise SystemExit('SH_SRCS not found in Makefile')
          missing=[f for f in m.group(1).split() if not Path(f).is_file()]
          if missing:
              raise SystemExit('Missing SH_SRCS: ' + ', '.join(missing))
          print('All SH_SRCS present')
          PY

      - name: Stamp Test255 identity
        shell: bash
        run: |
          set -euo pipefail
          cd build-test255
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Makefile')
          s=p.read_text()
          s=s.replace('SH_PROGRAM:= wrestlefest-saturn-test254-v0269','SH_PROGRAM:= wrestlefest-saturn-test255-v0270')
          s=s.replace('IP_VERSION:= V0.269','IP_VERSION:= V0.270')
          s=s.replace('IP_TITLE:= WWF WrestleFest Test254','IP_TITLE:= WWF WrestleFest Test255')
          p.write_text(s)
          PY

      - name: Build with pinned Yaul image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$YAUL_IMAGE"
          docker run --rm --platform linux/amd64 \
            -v "$PWD/build-test255:/work" -w /work \
            "$YAUL_IMAGE" /bin/bash -lc 'make clean && make'

      - name: Validate generated disc
        shell: bash
        run: |
          set -euo pipefail
          cd build-test255
          python3 tools/verify_iso.py .
          python3 tools/verify_bin_external.py . || true
          ls -lah *.bin *.cue *.iso 2>/dev/null || true

      - name: Package BIN/CUE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cd build-test255
          BIN=$(find . -maxdepth 1 -type f -iname '*.bin' | head -n1)
          CUE=$(find . -maxdepth 1 -type f -iname '*.cue' | head -n1)
          test -n "$BIN" && test -n "$CUE"
          cp "$BIN" ../out/WWF-WrestleFest-Test255-V0270.bin
          cp "$CUE" ../out/WWF-WrestleFest-Test255-V0270.cue
          cd ../out
          sed -i 's/^FILE ".*" BINARY/FILE "WWF-WrestleFest-Test255-V0270.bin" BINARY/' WWF-WrestleFest-Test255-V0270.cue
          sha256sum WWF-WrestleFest-Test255-V0270.bin WWF-WrestleFest-Test255-V0270.cue > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Test255 BIN/CUE
        uses: actions/upload-artifact@v4
        with:
          name: WWF-WrestleFest-Test255-V0270-BIN-CUE
          path: out/*
          if-no-files-found: error
