name: Build WWF WrestleFest Saturn Test255 Hardware Stability 4

on:
  workflow_dispatch:
  push:
    branches:
      - test255-lod-handoff
    paths:
      - .github/workflows/build-wrestlefest-saturn-test255.yml
      - tools/apply_hwfix4b.py
      - build-input/WWF-Saturn-Test255-WIP9-source.zip

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YAUL_IMAGE: ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6
      STEM: wrestlefest-saturn-test255-v0270-hwfix4
    steps:
      - name: Check out Test255 handoff branch
        uses: actions/checkout@v5
        with:
          ref: test255-lod-handoff

      - name: Restore source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/wwf-test255 build-test255 raw-disc out
          mkdir -p /tmp/wwf-test255 build-test255
          unzip -q build-input/WWF-Saturn-Test255-WIP9-source.zip -d /tmp/wwf-test255
          cp -a /tmp/wwf-test255/. ./build-test255/
          cp campaign_presentation.c campaign_presentation.h build-test255/
          cp tools/verify_iso.py build-test255/tools/verify_iso.py
          rm -f build-test255/audio-tracks/.gitkeep

      - name: Apply HWFIX4
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_hwfix4b.py build-test255
          grep -q 'match_pack_arena_raw=malloc(RING_TRANSITION_PACK_ALIGNED_BYTES+31U)' build-test255/main.c
          grep -q 'match_pack_kind' build-test255/main.c
          grep -q 'roster_pack_bind_verified' build-test255/main.c
          grep -q 'if(!ring_transition_pack_load())return;loaded_roster=true' build-test255/main.c
          ! grep -q 'OBJECT_PACK_ALIGNED_BYTES+RING_TRANSITION_PACK_ALIGNED_BYTES' build-test255/main.c
          ! grep -q 'static uint8_t object_pack_storage' build-test255/main.c
          ! grep -q 'static uint8_t ring_transition_pack_storage' build-test255/main.c

      - name: Stamp Test255 identity
        shell: bash
        run: |
          set -euo pipefail
          cd build-test255
          python3 - <<'PY'
          from pathlib import Path
          p=Path('Makefile')
          s=p.read_text()
          s=s.replace('SH_PROGRAM:= wrestlefest-saturn-test254-v0269','SH_PROGRAM:= wrestlefest-saturn-test255-v0270-hwfix4')
          s=s.replace('IP_VERSION:= V0.269','IP_VERSION:= V0.270')
          s=s.replace('IP_TITLE:= WWF WrestleFest Test254','IP_TITLE:= WWF WrestleFest Test255')
          p.write_text(s)
          PY

      - name: Build with pinned Yaul image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$YAUL_IMAGE"
          docker run --rm --platform linux/amd64 -v "$PWD/build-test255:/work" -w /work "$YAUL_IMAGE" /bin/bash -lc 'make clean && make'

      - name: Validate HWFIX4 memory strategy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'check_error=348' build-test255/main.c
          grep -q 'match_pack_arena_release();' build-test255/main.c
          grep -q 'if((!object_pack_data||!object_pack.data)&&!object_pack_load())return true;' build-test255/main.c
          grep -q 'if((!ring_transition_pack_data||!ring_transition_pack.data)&&!ring_transition_pack_load())return true;' build-test255/main.c

      - name: Validate ISO and convert to raw BIN/CUE
        shell: bash
        run: |
          set -euo pipefail
          cd build-test255
          python3 tools/verify_iso.py .
          python3 tools/iso_to_bin.py "$STEM.iso" ../raw-disc
          python3 tools/verify_bin_external.py "$STEM.iso" "../raw-disc/$STEM.cue" || true
          test -s "../raw-disc/$STEM.bin"
          test -s "../raw-disc/$STEM.cue"
          grep -q 'TRACK 01 MODE1/2352' "../raw-disc/$STEM.cue"

      - name: Package verified BIN/CUE
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp "raw-disc/$STEM.bin" out/WWF-WrestleFest-Test255-V0270-HWFIX4.bin
          cp "raw-disc/$STEM.cue" out/WWF-WrestleFest-Test255-V0270-HWFIX4.cue
          cp raw-disc/disc-validation.json out/disc-validation.json
          if test -f raw-disc/disc-independent-validation.json; then cp raw-disc/disc-independent-validation.json out/disc-independent-validation.json; fi
          sed -i 's/^FILE ".*" BINARY/FILE "WWF-WrestleFest-Test255-V0270-HWFIX4.bin" BINARY/' out/WWF-WrestleFest-Test255-V0270-HWFIX4.cue
          cd out
          sha256sum WWF-WrestleFest-Test255-V0270-HWFIX4.bin WWF-WrestleFest-Test255-V0270-HWFIX4.cue > SHA256SUMS.txt

      - name: Upload HWFIX4 BIN/CUE
        uses: actions/upload-artifact@v4
        with:
          name: WWF-WrestleFest-Test255-V0270-HWFIX4-BIN-CUE
          path: out/*
          if-no-files-found: error
